<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เกม: เอาตัวรอด 16 วัน</title>
<!--
  ===== ช่องสำหรับเกม =====
  • ใส่เกมแทนส่วน <main class="game-slot"> ด้านล่างได้เลย
  • ใช้สีและฟอนต์เดียวกับเรื่องหลักจาก assets/style.css
  • ใช้ภาพวาดสัตว์ได้ทันที เช่น <svg viewBox="0 0 120 80"><use href="#leech"/></svg>
    (รายชื่อภาพทั้งหมดอยู่บนสุดของ assets/art.js)
  • ถ้าเกมมีโค้ดเยอะ แยกเป็นไฟล์ assets/game.js แล้วใส่ <script src="assets/game.js"></script> ท้ายไฟล์นี้
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=Sarabun:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  .game-slot { max-width: 880px; margin: 0 auto; padding: 72px 24px 120px; display: flex; flex-direction: column; gap: 26px; position: relative; z-index: 1; }
  .game-slot h1 { font-size: clamp(40px, 7vw, 76px); line-height: 1.1; }
  .game-slot h1 em { font-style: normal; color: var(--siren); }
  .cast { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .cast figure { margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; text-align: center; font-family: var(--font-display); font-size: 19px; }
  .cast svg { width: 100%; }
  .soon { border: 1px dashed rgba(232, 137, 59, 0.6); border-radius: 16px; padding: 22px; background: rgba(232, 137, 59, 0.06); font-size: 20px; }
  .back { width: fit-content; }
  @media (max-width: 600px) { .cast { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>
</head>
<body>
<main class="game-slot">
  <a class="cta-btn back" href="index.html#p-ready">← กลับไปที่เรื่อง</a>
  <h1>เอาตัวรอด <em>16 วัน</em></h1>
  <p class="lead">น้ำท่วมบ้านคุณ 16 วัน ลองตัดสินใจเองทุกวันว่าจะรอดจากผู้ต้องสงสัยเหล่านี้ได้ไหม</p>
  <div class="cast">
    <figure><svg viewBox="0 0 120 80" aria-hidden="true"><use href="#leech"/></svg>ปลิง</figure>
    <figure><svg viewBox="0 0 120 80" aria-hidden="true"><use href="#snake"/></svg>งู</figure>
    <figure><svg viewBox="0 0 120 80" aria-hidden="true"><use href="#centipede"/></svg>ตะขาบ</figure>
    <figure><svg viewBox="0 0 120 80" aria-hidden="true"><use href="#rat"/></svg>หนู / ฉี่หนู</figure>
  </div>
  <p class="soon">เกมกำลังพัฒนา เร็วๆ นี้</p>
</main>
<script src="assets/art.js"></script>
</body>
</html>
