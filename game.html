<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เกม: เอาตัวรอด 16 วัน</title>
<!--
  ===== ไฟล์นี้รวม style.css, art.js, story-data.js, story.js ไว้ในไฟล์เดียวแล้ว อัปไฟล์นี้ไฟล์เดียวก็ใช้ได้ =====
  ===== ช่องสำหรับเกม =====
  • ใส่เกมแทนส่วน <main class="game-slot"> ด้านล่างได้เลย
  • ใช้สีและฟอนต์เดียวกับเรื่องหลักจาก style.css
  • ใช้ภาพวาดสัตว์ได้ทันที เช่น <svg viewBox="0 0 120 80"><use href="#leech"/></svg>
    (รายชื่อภาพทั้งหมดอยู่บนสุดของ art.js)
  • ถ้าเกมมีโค้ดเยอะ แยกเป็นไฟล์ game.js แล้วใส่ <script src="game.js"></script> ท้ายไฟล์นี้
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=Sarabun:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* VOICE   : เล่าเหมือนข่าวสืบสวนตอนกลางคืน จริงจังแต่อ่านง่าย เด็กก็ตามทัน
   IDEA    : เลื่อนผ่านคำร้องจริงทีละใบ ระดับน้ำด้านหลังขึ้นลงตามวันของน้ำท่วม
   PICTURE : ภาพวาดบ้านกลางน้ำ สัตว์ 4 ตัว และฉาก 3 ระลอก วาดเองด้วย SVG (art.js)
   COLOUR  : คืนสีน้ำเงินเขียวเข้ม ตัวหนังสือสีกระดูก ส้มไซเรนคือสีเด่น แดงปลิงใช้กับอันตรายเท่านั้น
   LAYOUT  : คอลัมน์เดียว 1080px แบ่ง 4 บท ทุกบทมีจุดให้แตะเล่น */
:root {
  --night: #0D181C;
  --water: #16313A;
  --bone: #E9E3D3;
  --silt: #9DB0AF;
  --siren: #E8893B;
  --leech: #D9534F;
  --safe: #62B48D;
  --line: rgba(233, 227, 211, 0.14);
  --card: rgba(233, 227, 211, 0.04);
  --font-display: "Bai Jamjuree", "Sarabun", system-ui, sans-serif;
  --font-body: "Sarabun", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; min-width: 0; }
html { scroll-behavior: smooth; scroll-padding-top: 72px; }
body { margin: 0; background: var(--night); color: var(--bone); font-family: var(--font-body); font-size: 19px; line-height: 1.75; -webkit-font-smoothing: antialiased; overflow-x: clip; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.25; text-wrap: balance; margin: 0; }
p { margin: 0; max-width: 64ch; }
a { color: var(--siren); }
a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--siren); outline-offset: 3px; }
button { font: inherit; }
.num { font-variant-numeric: tabular-nums; }
.t-siren { color: var(--siren); }
.t-leech { color: var(--leech); }

/* ฉากหลัง: ระดับน้ำ ความแดง แถบความคืบหน้า */
#flood { position: fixed; left: 0; right: 0; bottom: 0; height: 6vh; z-index: 0; pointer-events: none; transition: height 0.25s linear; }
#flood svg { position: absolute; top: -18px; left: 0; width: 200%; height: 20px; animation: drift 9s linear infinite; }
#flood .body { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(38, 84, 92, 0.55), rgba(22, 49, 58, 0.85)); }
#flood .rust { position: absolute; inset: 0; opacity: 0; background: linear-gradient(180deg, rgba(122, 64, 42, 0.6), rgba(68, 34, 28, 0.9)); }
#heat { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0; background: radial-gradient(130% 75% at 50% 115%, rgba(217, 83, 79, 0.6), rgba(217, 83, 79, 0) 70%), radial-gradient(60% 50% at 100% 0%, rgba(217, 83, 79, 0.18), rgba(217, 83, 79, 0) 70%); }
#gauge { position: fixed; right: 18px; top: 50%; transform: translateY(-50%); z-index: 3; font-family: var(--font-mono); font-size: 13px; color: var(--silt); display: flex; flex-direction: column; align-items: center; gap: 6px; }
#gauge .bar { width: 4px; height: 160px; background: var(--line); border-radius: 2px; position: relative; overflow: hidden; }
#gauge .fill { position: absolute; left: 0; right: 0; bottom: 0; background: var(--siren); height: 0%; }
#prog { position: fixed; top: 0; left: 0; right: 0; height: 4px; z-index: 20; pointer-events: none; background: rgba(233, 227, 211, 0.06); }
#prog .fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--siren), var(--leech)); }
@keyframes drift { from { transform: translateX(0); } to { transform: translateX(-50%); } }

/* เมนูบท */
.chap { position: fixed; top: 12px; left: 50%; z-index: 15; transform: translate(-50%, -90px); transition: transform 0.35s ease; }
.chap.show { transform: translate(-50%, 0); }
.chap-now { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 6px 16px; border-radius: 40px; border: 1px solid var(--line); background: rgba(13, 24, 28, 0.9); backdrop-filter: blur(8px); color: var(--bone); font-family: var(--font-display); font-size: 16px; cursor: pointer; white-space: nowrap; }
#chapNum { font-family: var(--font-mono); font-size: 13px; color: var(--siren); }
#chapList { position: absolute; top: 54px; left: 50%; transform: translateX(-50%); min-width: 250px; margin: 0; padding: 8px; list-style: none; background: #13252B; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5); }
#chapList a { display: block; padding: 10px 14px; border-radius: 8px; color: var(--bone); text-decoration: none; font-family: var(--font-display); font-size: 17px; }
#chapList a:hover { background: rgba(233, 227, 211, 0.07); }
#chapList a[aria-current="true"] { color: var(--siren); }

/* โครงหน้า */
main { position: relative; z-index: 1; }
.page { max-width: 1080px; margin: 0 auto; padding: 88px 24px; display: flex; flex-direction: column; gap: 28px; }
.eyebrow { font-family: var(--font-mono); font-size: 14px; letter-spacing: 0.04em; color: color-mix(in oklab, var(--siren), var(--leech) calc(var(--heat, 0) * 100%)); }
.page h2 { font-size: clamp(30px, 4.4vw, 48px); font-weight: 700; }
.lead { font-size: 22px; }
.muted { color: var(--silt); }
.note, .hint { font-size: 15.5px; color: var(--silt); }
.chapter { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; padding: 120px 24px 24px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.chapter-n { font-family: var(--font-mono); font-size: 14px; color: var(--siren); }
.chapter-t { font-size: clamp(42px, 7vw, 84px); font-weight: 700; line-height: 1.1; }
.chapter-q { font-family: var(--font-display); font-weight: 600; font-size: clamp(22px, 3vw, 34px); line-height: 1.4; color: var(--silt); max-width: 30ch; }
.chapter-q em { font-style: normal; color: var(--siren); }

/* กล่อง "นับยังไง" พับได้ */
.how { border: 1px solid var(--line); border-radius: 12px; padding: 0 18px; max-width: 72ch; }
.how summary { cursor: pointer; list-style: none; padding: 12px 0; font-size: 16px; color: var(--silt); display: flex; align-items: center; gap: 10px; min-height: 44px; }
.how summary::-webkit-details-marker { display: none; }
.how summary::before { content: ""; width: 8px; height: 8px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(-45deg); transition: transform 0.2s; flex: none; }
.how[open] summary::before { transform: rotate(45deg); }
.how summary:hover { color: var(--bone); }
.how p { padding-bottom: 16px; font-size: 16px; color: var(--silt); }

/* คำที่แตะเพื่อดูความหมาย */
.tip { color: inherit; background: none; border: 0; padding: 0; border-bottom: 2px dotted var(--siren); cursor: help; font-weight: 600; line-height: inherit; }
.tip:hover { color: var(--siren); }
.sheet { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 30; width: min(560px, calc(100% - 24px)); background: var(--bone); color: #1E1A14; border-radius: 16px; padding: 18px 20px; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 14px; }
.sheet[hidden] { display: none; }
.sheet b { font-family: var(--font-display); font-size: 19px; }
.sheet p { grid-column: 1; font-size: 17px; line-height: 1.6; }
.sheet button { grid-column: 2; grid-row: 1 / 3; align-self: start; min-height: 40px; padding: 6px 16px; border: 0; border-radius: 20px; background: #1E1A14; color: var(--bone); cursor: pointer; }

/* ใบคำร้อง */
.ticket { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; display: flex; flex-direction: column; gap: 8px; }
.ticket:has(.t-ico) { padding-right: 86px; }
.ticket .t-ico { position: absolute; right: 14px; top: 14px; width: 62px; }
.ticket .meta { font-family: var(--font-mono); font-size: 13.5px; color: var(--silt); display: flex; gap: 14px; flex-wrap: wrap; }
.ticket .meta b { color: var(--siren); font-weight: 500; }
.ticket q { font-size: 20px; quotes: "“" "”"; }
.ticket q.loud { font-size: 27px; font-weight: 600; }
.ticket.red { border-color: rgba(217, 83, 79, 0.55); }
.ticket.red .meta b { color: var(--leech); }
.ticket.ok { border-color: rgba(98, 180, 141, 0.6); }
.ticket.ok .meta b { color: var(--safe); }
.tickets { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }

/* เปิดเรื่อง */
.hero { padding-top: 96px; }
.hero-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 32px; align-items: center; }
.hero-art { margin: 0; }
.hero-art svg, .end-art svg { display: block; width: 100%; height: auto; }
.bubble { position: relative; background: var(--bone); color: #1E1A14; border-radius: 16px; padding: 22px 24px; box-shadow: 0 14px 34px rgba(0, 0, 0, 0.45); }
.bubble::before { content: ""; position: absolute; left: -12px; top: 38%; border: 12px solid transparent; border-left: 0; border-right-color: var(--bone); }
.bubble-meta { font-family: var(--font-mono); font-size: 13px; color: #5B544A; margin-bottom: 8px; }
.bubble .lines { display: flex; flex-direction: column; gap: 6px; font-size: clamp(19px, 2.1vw, 23px); line-height: 1.55; }
.bubble .t-leech { color: #B0302C; }
.bubble .t-siren { color: #A9520F; }
.js .bubble .lines span { animation: type 0.9s ease-out both; }
.js .bubble .lines span:nth-child(2) { animation-delay: 0.7s; }
.js .bubble .lines span:nth-child(3) { animation-delay: 1.4s; }
.js .bubble .lines span:nth-child(4) { animation-delay: 2.1s; }
@keyframes type { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.hero h1 { font-size: clamp(52px, 9vw, 112px); font-weight: 700; line-height: 1.05; margin-top: 8px; }
.hero h1 em { font-style: normal; color: var(--siren); }
.scroll-hint { display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--silt); font-size: 15px; padding-top: 12px; }
.scroll-hint svg { animation: sh-bounce 2.2s ease-in-out infinite; }
@keyframes sh-bounce { 0%, 100% { transform: translateY(0); } 55% { transform: translateY(10px); } }

/* จระเข้ */
.search { display: flex; align-items: center; gap: 14px; background: var(--bone); color: var(--night); border-radius: 40px; padding: 12px 22px; width: fit-content; font-size: 22px; font-weight: 600; }
.caret { width: 2px; height: 1.1em; background: var(--night); margin-left: -10px; opacity: 0; }
.searching .caret { opacity: 1; animation: blink 0.8s steps(1) infinite; }
#qStatus { min-height: 1.7em; font-family: var(--font-mono); }
.big { font-family: var(--font-display); font-weight: 700; font-size: clamp(90px, 18vw, 200px); line-height: 1; color: var(--siren); }
.croc-row { display: flex; align-items: flex-end; gap: 12px 28px; flex-wrap: wrap; }
.croc-art { width: clamp(150px, 24vw, 260px); }
#n566 { transition: color 0.6s; transform-origin: left bottom; cursor: pointer; }
#n566.ticking { color: var(--bone); }
#n566.landed { animation: land 0.45s cubic-bezier(0.3, 1.6, 0.5, 1); }
@keyframes land { 40% { transform: scale(1.08); } }
mark { background: var(--siren); color: var(--night); padding: 0 3px; border-radius: 3px; }
mark.red { background: var(--leech); color: var(--bone); }

/* จับผิดคำร้อง */
.fakes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.fake { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; transition: border-color 0.3s, background 0.3s; }
.fake q { font-size: 21px; quotes: "“" "”"; }
.fake-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.fake-btns button { min-height: 44px; padding: 6px 18px; border-radius: 30px; border: 1px solid rgba(233, 227, 211, 0.3); background: transparent; color: var(--bone); font-family: var(--font-display); font-size: 16px; cursor: pointer; }
.fake-btns button:hover { border-color: var(--siren); }
.fake.done .fake-btns button { cursor: default; opacity: 0.45; }
.fake.done .fake-btns button.picked { opacity: 1; background: rgba(233, 227, 211, 0.12); }
.fake.right { border-color: rgba(98, 180, 141, 0.7); background: rgba(98, 180, 141, 0.07); }
.fake.wrong { border-color: rgba(232, 137, 59, 0.7); background: rgba(232, 137, 59, 0.07); }
.fake-why { font-size: 16.5px; color: var(--silt); }
.fake-why b { color: var(--bone); }
.js .fake:not(.done) .fake-why { display: none; }
.fake-score { font-family: var(--font-display); font-size: 21px; min-height: 1.5em; }
.funnel { display: flex; align-items: flex-end; gap: 20px 32px; flex-wrap: wrap; }
.funnel > div { display: flex; flex-direction: column; gap: 4px; max-width: 16em; }
.funnel .n { font-family: var(--font-display); font-weight: 700; line-height: 1; }
.funnel-end svg { width: 130px; }
.clean { border-top: 1px solid var(--line); padding-top: 28px; display: flex; flex-direction: column; gap: 16px; }
.clean-t { font-size: 22px; }
.sieve { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.sieve li { display: grid; grid-template-columns: 112px minmax(0, 1fr); align-items: baseline; gap: 18px; padding: 12px 18px; border-left: 5px solid rgba(233, 227, 211, 0.25); background: var(--card); border-radius: 0 10px 10px 0; }
.sieve li:nth-child(2) { margin-left: 3%; }
.sieve li:nth-child(3) { margin-left: 6%; }
.sieve li:nth-child(4) { margin-left: 9%; }
.sieve b { font-family: var(--font-display); font-size: 30px; text-align: right; }
.sieve span { font-size: 17.5px; }
.sieve li.hl { border-left-color: var(--leech); background: rgba(217, 83, 79, 0.08); }
.sieve li.hl b { color: var(--leech); }

/* กราฟ */
.chart { width: 100%; overflow-x: auto; }
.chart svg { display: block; width: 100%; height: auto; min-width: 560px; }
.chart text { fill: var(--silt); font-family: var(--font-body); font-size: 13.5px; transition: opacity 0.4s; }
.chart .hl { fill: var(--bone); font-weight: 600; }
.chart-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.readout { font-size: 17px; color: var(--silt); min-height: 1.7em; }
.readout b { color: var(--bone); }
.replay { min-height: 40px; padding: 6px 16px; border-radius: 30px; border: 1px solid var(--line); background: transparent; color: var(--bone); font-family: var(--font-display); font-size: 15px; cursor: pointer; }
.replay:hover { border-color: var(--siren); }
.hit { fill: transparent; cursor: pointer; }

/* ทายสิ */
.quiz { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.quiz button { color: var(--bone); background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 12px 16px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: border-color 0.2s, transform 0.2s; }
.quiz button:hover { border-color: var(--siren); transform: translateY(-3px); }
.quiz svg { width: 100%; max-width: 130px; }
.quiz .nm { font-family: var(--font-display); font-size: 23px; font-weight: 600; }
.quiz .x { font-family: var(--font-mono); font-size: 15px; color: var(--silt); visibility: hidden; }
.quiz.done .x { visibility: visible; }
.quiz.done button.win { border-color: var(--leech); background: rgba(217, 83, 79, 0.12); animation: quiz-pop 0.55s cubic-bezier(0.3, 1.5, 0.5, 1); }
@keyframes quiz-pop { 35% { transform: scale(1.1); } 75% { transform: scale(0.97); } }
.quiz-msg { font-size: 21px; min-height: 1.7em; }

/* หมายจับ */
.wanted { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.poster { width: 150px; background: #E6DCC4; color: #1E1A14; border-radius: 4px; padding: 14px 12px; display: flex; flex-direction: column; align-items: center; gap: 2px; box-shadow: 0 8px 22px rgba(0, 0, 0, 0.4); }
.poster svg { width: 100%; }
.poster .w { font-family: var(--font-display); font-weight: 700; letter-spacing: 0.18em; font-size: 15px; }
.poster .who { font-weight: 600; font-size: 18px; }
.poster .k { display: inline-block; font-family: var(--font-display); font-weight: 700; line-height: 1.05; }
.poster .f { font-family: var(--font-mono); font-size: 13px; }
.poster.top { width: 230px; padding: 20px 14px; border: 5px solid var(--leech); }
.poster.top .w { font-size: 22px; }
.poster.top .who { font-size: 21px; }
.poster.top .w, .poster.top .k { color: #B0302C; }
.fact { display: flex; align-items: center; gap: 18px; border: 1px dashed rgba(217, 83, 79, 0.55); border-radius: 14px; padding: 14px 20px; background: rgba(217, 83, 79, 0.06); max-width: 760px; }
.fact svg { width: 96px; flex: none; }
.fact p { font-size: 18px; }
.fact b { color: var(--leech); }

/* 10 วันในบ้าน */
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 32px; align-items: start; }
.home-left { display: flex; flex-direction: column; gap: 22px; }
.cal { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.cal span { position: relative; font-family: var(--font-display); font-weight: 700; font-size: 20px; text-align: center; padding: 12px 0; border-radius: 8px; background: rgba(233, 227, 211, 0.05); color: var(--silt); }
.cal span::after { content: ""; position: absolute; left: 18%; right: 18%; top: 52%; height: 2px; background: var(--leech); transform-origin: left; transition: transform 0.25s ease-out; transition-delay: calc(var(--i, 0) * 260ms); }
.cal span:last-child { color: var(--siren); border: 2px solid var(--siren); }
.cal span:last-child::after { display: none; }
.cal.armed span::after { transform: scaleX(0); }
.cal.in span:last-child { animation: glow 1.4s ease-in-out 2.6s 3; }
@keyframes glow { 50% { box-shadow: 0 0 0 6px rgba(232, 137, 59, 0.25); background: rgba(232, 137, 59, 0.15); } }
.letter { background: var(--bone); color: #1E1A14; border-radius: 6px; padding: 28px; font-size: 21px; line-height: 1.75; display: flex; flex-direction: column; gap: 10px; }
.letter .meta { font-family: var(--font-mono); font-size: 13.5px; color: #5B544A; }

/* Aha */
.aha { font-family: var(--font-display); font-weight: 700; font-size: clamp(30px, 4.6vw, 52px); line-height: 1.3; max-width: none; }
.aha em { font-style: normal; color: var(--siren); }
.waves { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.wave { border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px 20px; display: flex; flex-direction: column; gap: 8px; background: var(--card); }
.wave svg { width: 100%; border-radius: 10px; background: rgba(0, 0, 0, 0.18); }
.wave h3 { font-size: 22px; }
.wave .k { font-family: var(--font-display); font-weight: 700; font-size: 44px; line-height: 1; }
.wave p { font-size: 17px; }
.wave.peak { border: 2px solid var(--siren); background: rgba(232, 137, 59, 0.07); }
.wave.peak .k { color: var(--siren); }
.wave.ghost { border-style: dashed; }

/* แผนที่ */
.map svg { width: 100%; height: auto; display: block; max-height: 640px; }
.map text { font-family: var(--font-body); font-weight: 600; fill: var(--bone); paint-order: stroke; stroke: var(--night); stroke-width: 0.5px; }
